# Matcher corpus: real-world-style Soulseek paths and the expected verdict.
#
# Add cases you find with `slskify dry-run <url>`. Each [[case]] describes
# one Spotify track and one remote file.
#
#   expect = "match"   confidence >= high threshold (80)
#   expect = "review"  low (50) <= confidence < high
#   expect = "reject"  confidence < low threshold (50)
#   min_conf / max_conf optionally tighten the bounds.
#
# Track fields: title, artists, album, album_type, track_number,
#   duration_s, explicit.
# File fields:  path, length_s (0 = unknown), bitrate, size_mb (default 8).

[[case]]
note = "plain album folder"
title = "Karma Police"
artists = ["Radiohead"]
album = "OK Computer"
track_number = 6
duration_s = 264
path = '@@kq\Music\Radiohead\OK Computer (1997)\06 - Karma Police.flac'
length_s = 264
expect = "match"

